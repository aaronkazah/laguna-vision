[metadata]
name = laguna-vision
version = 0.1.0
description = Production-oriented visual bridge for giving Laguna general image and screenshot understanding.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.9
include_package_data = true

[options.packages.find]
include = lagunavision*

[options.entry_points]
console_scripts =
    laguna-vision = lagunavision.cli:main
    lagunavision = lagunavision.cli:main

[options.extras_require]
dev =
    pytest>=8.0
    pillow>=10.0
llama =
    torch>=2.3
    torchvision>=0.18
    transformers>=5.9,<6
    accelerate>=0.34
    bitsandbytes>=0.43
    peft>=0.18,<0.19
data =
    datasets>=2.20
    pillow>=10.0
web =
    playwright>=1.48
publish =
    huggingface_hub>=0.24
